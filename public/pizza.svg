<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Pizza base (crust) -->
  <circle cx="50" cy="50" r="45" fill="#FFA500"/>
  <circle cx="50" cy="50" r="40" fill="#FFD700"/>
  
  <!-- Pizza slices lines -->
  <line x1="50" y1="50" x2="50" y2="5" stroke="#8B4513" stroke-width="2"/>
  <line x1="50" y1="50" x2="95" y2="50" stroke="#8B4513" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="95" stroke="#8B4513" stroke-width="2"/>
  <line x1="50" y1="50" x2="5" y2="50" stroke="#8B4513" stroke-width="2"/>
  <line x1="50" y1="50" x2="85" y2="85" stroke="#8B4513" stroke-width="2"/>
  <line x1="50" y1="50" x2="15" y2="85" stroke="#8B4513" stroke-width="2"/>
  <line x1="50" y1="50" x2="85" y2="15" stroke="#8B4513" stroke-width="2"/>
  <line x1="50" y1="50" x2="15" y2="15" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Pepperoni -->
  <circle cx="35" cy="35" r="5" fill="#FF0000"/>
  <circle cx="65" cy="35" r="5" fill="#FF0000"/>
  <circle cx="50" cy="65" r="5" fill="#FF0000"/>
  <circle cx="30" cy="60" r="5" fill="#FF0000"/>
  <circle cx="70" cy="60" r="5" fill="#FF0000"/>
</svg> 